apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: python-app
        image: python:3.9-slim
        livenessProbe:
          httpGet:
            path: /
            port: 8080
        command: ["sh", "-c"]
        args: 
          - |
            pip install redis && python -c '
            import os, redis, time
            host = os.getenv("REDIS_HOST", "localhost")
            r = redis.Redis(host=host, port=6379)
            while True:
                try:
                    r.ping()
                    print("Connected to Redis!")
                except Exception as e:
                    print(f"Failed to connect: {e}")
                time.sleep(5)
            '
        
